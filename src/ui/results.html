<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
  <title>Trade results</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/windows.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/polish.css">
  <link rel="stylesheet" href="css/native.css">
</head>
<body class="results">
  <header class="res-top">
    <div class="res-title"><span id="title">Trade results</span> <span id="betaTag" class="beta-tag hidden" title="Path of Exile 1 support is new: if something looks wrong, send the log (Tray → Open log) to support@poe2upgrade.com">PoE1 BETA</span></div>
    <div class="dim" id="sub"></div>
    <div class="note" id="note"></div>
    <div class="price-banner hidden" id="priceBanner"></div>
  </header>
  <!-- only the controls stay on screen while you scroll; the title and notes scroll away -->
  <div class="res-head">
    <div class="toolbar">
      <label>Sort <select id="sort">
        <option value="res">Resistances first</option>
        <option value="upgrade">Best upgrade</option>
        <option value="gear">Best gear score</option>
        <option value="value" title="The upgrade, less a little for each tenfold of the price: Path of Building's way of weighing value">Best value for the price</option>
        <option value="price">Cheapest</option>
        <option value="site">Trade site order</option>
      </select></label>
      <label><input type="checkbox" id="onlyUp"> Upgrades only</label>
      <label title="Hide corrupted listings"><input type="checkbox" id="noCorrupt"> Hide corrupted</label>
      <label title="Show only each seller's first listing in this order (some sellers list many near-copies)"><input type="checkbox" id="onePerSeller"> One per seller</label>
      <label title="How many of each listing's stat changes to show on its card">Show <select id="modCount">
        <option value="3">3 mods</option><option value="4">4 mods</option><option value="5">5 mods</option>
        <option value="6">6 mods</option><option value="8">8 mods</option><option value="all">all mods</option>
      </select></label>
      <span class="grow"></span>
      <button id="save" title="Save this search so you can re-run it later">☆ Save search</button>
      <button id="site">Open on trade site</button>
      <button id="gsHelpBtn" class="link" title="How the gear score and the UPGRADE / SIDEGRADE verdicts work">What's the gear score?</button>
      <span class="dim small" id="hideHint">Esc hides</span>
    </div>
    <div id="gsHelp" class="gs-panel hidden"></div>
  </div>
  <main id="list" class="res-list"></main>
  <div class="row center"><button id="more">Load 10 more</button><span id="moreMsg" class="note"></span></div>
  <script src="../core/keepsell.js"></script>
  <script src="render.js"></script>
  <script src="render-blocks.js"></script>
  <script src="render-prices.js"></script>
  <script src="render-cards.js"></script>
  <script src="results.js"></script>
</body>
</html>
